apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: allowed-backend
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: allowed-backend
  template:
    metadata:
      labels:
        app: allowed-backend
    spec:
      containers:
        - name: http
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=allowed"]
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: allowed-backend
  namespace: demo
spec:
  selector:
    app: allowed-backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: denied-backend
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: denied-backend
  template:
    metadata:
      labels:
        app: denied-backend
    spec:
      containers:
        - name: http
          image: hashicorp/http-echo:1.0
          args: ["-listen=:8080", "-text=denied"]
---
apiVersion: v1
kind: Service
metadata:
  name: denied-backend
  namespace: demo
spec:
  selector:
    app: denied-backend
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: restricted-client
  namespace: demo
  labels:
    firewall.example.io/restricted: "true"
spec:
  containers:
    - name: client
      image: nicolaka/netshoot:v0.13
      command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: unrestricted-client
  namespace: demo
spec:
  containers:
    - name: client
      image: nicolaka/netshoot:v0.13
      command: ["sleep", "infinity"]
