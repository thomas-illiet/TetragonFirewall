name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install eBPF compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm
      - name: Unit tests with race detector
        run: make generate && go test -race -coverprofile=coverage.out ./...
      - name: Static and portable integration checks
        run: make test-all
      - name: Verify source-only generation
        run: |
          make clean-generated
          make generate
          test -f internal/bpf/firewall_bpfel.o
          test -f internal/bpf/firewall_bpfel.go
          test -z "$(git status --short --untracked-files=all internal/bpf | grep firewall_bpf || true)"
      - name: Build container image
        run: docker build -t tetragon-firewall:ci .
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
